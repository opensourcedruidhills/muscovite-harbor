apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargodecomposition
  namespace: muscoviteharbor
  labels:
    app: cargodecomposition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargodecomposition
  template:
    metadata:
      labels:
        app: cargodecomposition
    spec:
      serviceAccountName: cargodecomposition
      containers:
        - name: cargodecomposition
          image: cargodecomposition:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: cargodecomposition-config
