apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbourcontrol
  namespace: muscoviteharbor
  labels:
    app: harbourcontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbourcontrol
  template:
    metadata:
      labels:
        app: harbourcontrol
    spec:
      serviceAccountName: harbourcontrol
      containers:
        - name: harbourcontrol
          image: harbourcontrol:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: harbourcontrol-config
