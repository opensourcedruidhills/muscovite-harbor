apiVersion: apps/v1
kind: Deployment
metadata:
  name: passengerterminal
  namespace: muscoviteharbor
  labels:
    app: passengerterminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passengerterminal
  template:
    metadata:
      labels:
        app: passengerterminal
    spec:
      serviceAccountName: passengerterminal
      containers:
        - name: passengerterminal
          image: passengerterminal:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: passengerterminal-config
