apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cargooperations-allow-namespace
  namespace: muscoviteharbor
spec:
  podSelector:
    matchLabels:
      app: cargooperations
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: muscoviteharbor
