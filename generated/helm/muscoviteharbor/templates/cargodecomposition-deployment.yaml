apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargodecomposition
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.cargodecomposition.replicaCount }}
  selector:
    matchLabels:
      app: cargodecomposition
  template:
    metadata:
      labels:
        app: cargodecomposition
    spec:
      containers:
        - name: cargodecomposition
          image: "{{ .Values.cargodecomposition.image.repository }}:{{ .Values.cargodecomposition.image.tag }}"
          imagePullPolicy: {{ .Values.cargodecomposition.image.pullPolicy }}
          ports:
            - containerPort: 50051
